<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* AI 辅助论坛原型 · 品牌颜色与字体系统 */

@font-face {
  font-family: 'InstrumentSans';
  src: url('assets/fonts/InstrumentSans-Regular.ttf') format('truetype');
  font-weight: 400;
  font-display: swap;
}

@font-face {
  font-family: 'InstrumentSans';
  src: url('assets/fonts/InstrumentSans-Bold.ttf') format('truetype');
  font-weight: 700;
  font-display: swap;
}

@font-face {
  font-family: 'GeistMono';
  src: url('assets/fonts/GeistMono-Regular.ttf') format('truetype');
  font-weight: 400;
  font-display: swap;
}

:root {
  /* Primary scale — derived from #5b6cff */
  --aif-primary-50: #eef0ff;
  --aif-primary-100: #d8dcff;
  --aif-primary-200: #b6bdff;
  --aif-primary-300: #8e95ff;
  --aif-primary-400: #6c78ff;
  --aif-primary-500: #5b6cff;
  --aif-primary-600: #4a59e6;
  --aif-primary-700: #3d49be;
  --aif-primary-800: #333e9a;
  --aif-primary-900: #2d3779;

  /* Neutral scale — derived from #1c2333 */
  --aif-neutral-50: #f6f7f9;
  --aif-neutral-100: #eceef2;
  --aif-neutral-200: #e4e8f1;
  --aif-neutral-300: #cbd2e0;
  --aif-neutral-400: #9ba4b8;
  --aif-neutral-500: #697386;
  --aif-neutral-600: #4b5366;
  --aif-neutral-700: #353b4d;
  --aif-neutral-800: #1c2333;
  --aif-neutral-900: #111623;

  /* Semantic aliases */
  --aif-background: #f3f5fb;
  --aif-foreground: #1c2333;
  --aif-card: #ffffff;
  --aif-card-foreground: #1c2333;
  --aif-popover: #ffffff;
  --aif-popover-foreground: #1c2333;
  --aif-primary: #5b6cff;
  --aif-primary-foreground: #ffffff;
  --aif-muted: #f6f7f9;
  --aif-muted-foreground: #697386;
  --aif-border: #e4e8f1;
  --aif-input: #e4e8f1;
  --aif-ring: #5b6cff;

  /* Radius */
  --aif-radius-small: 4px;
  --aif-radius-medium: 8px;
  --aif-radius-large: 12px;

  /* State colors */
  --state-success: #14b585;
  --state-success-bg: rgba(20, 181, 133, 0.10);
  --state-warning: #e0822e;
  --state-warning-bg: rgba(224, 130, 46, 0.10);
  --state-error: #ef4444;
  --state-error-bg: rgba(239, 68, 68, 0.10);
  --state-info: #5b6cff;
  --state-info-bg: rgba(91, 108, 255, 0.10);

  /* Typography */
  --aif-font-title: 'InstrumentSans', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  --aif-font-body: 'InstrumentSans', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  --aif-font-mono: 'GeistMono', 'SFMono-Regular', Consolas, monospace;

  /* Legacy aliases for direct use */
  --bg: #f3f5fb;
  --bg2: #ffffff;
  --ink: #1c2333;
  --muted: #697386;
  --rule: #e4e8f1;
  --accent: #5b6cff;
  --accent2: #14b585;
  --warn: #e0822e;
  --font: var(--aif-font-body);
  --font-mono: var(--aif-font-mono);
}

/* Dark mode tokens */
@media (prefers-color-scheme: dark) {
  :root {
    --aif-background: #111623;
    --aif-foreground: #f6f7f9;
    --aif-card: #1c2333;
    --aif-card-foreground: #f6f7f9;
    --aif-popover: #1c2333;
    --aif-popover-foreground: #f6f7f9;
    --aif-muted: #353b4d;
    --aif-muted-foreground: #9ba4b8;
    --aif-border: #353b4d;
    --aif-input: #353b4d;
    --aif-ring: #8e95ff;

    --bg: #111623;
    --bg2: #1c2333;
    --ink: #f6f7f9;
    --muted: #9ba4b8;
    --rule: #353b4d;
  }
}

html.light {
  --aif-background: #f3f5fb;
  --aif-foreground: #1c2333;
  --aif-card: #ffffff;
  --aif-card-foreground: #1c2333;
  --aif-popover: #ffffff;
  --aif-popover-foreground: #1c2333;
  --aif-muted: #f6f7f9;
  --aif-muted-foreground: #697386;
  --aif-border: #e4e8f1;
  --aif-input: #e4e8f1;
  --aif-ring: #5b6cff;

  --bg: #f3f5fb;
  --bg2: #ffffff;
  --ink: #1c2333;
  --muted: #697386;
  --rule: #e4e8f1;
}

html.dark {
  --aif-background: #111623;
  --aif-foreground: #f6f7f9;
  --aif-card: #1c2333;
  --aif-card-foreground: #f6f7f9;
  --aif-popover: #1c2333;
  --aif-popover-foreground: #f6f7f9;
  --aif-muted: #353b4d;
  --aif-muted-foreground: #9ba4b8;
  --aif-border: #353b4d;
  --aif-input: #353b4d;
  --aif-ring: #8e95ff;

  --bg: #111623;
  --bg2: #1c2333;
  --ink: #f6f7f9;
  --muted: #9ba4b8;
  --rule: #353b4d;
}

    </style>

    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--aif-background);
    --color-foreground: var(--aif-foreground);
    --color-card: var(--aif-card);
    --color-card-foreground: var(--aif-card-foreground);
    --color-popover: var(--aif-popover);
    --color-popover-foreground: var(--aif-popover-foreground);
    --color-primary: var(--aif-primary);
    --color-primary-foreground: var(--aif-primary-foreground);
    --color-muted: var(--aif-muted);
    --color-muted-foreground: var(--aif-muted-foreground);
    --color-border: var(--aif-border);
    --color-input: var(--aif-input);
    --color-ring: var(--aif-ring);
    --color-accent: var(--accent);
    --radius-sm: var(--aif-radius-small);
    --radius-md: var(--aif-radius-medium);
    --radius-lg: var(--aif-radius-large);
  }
  @layer base {
    body { background: var(--aif-background); color: var(--aif-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
