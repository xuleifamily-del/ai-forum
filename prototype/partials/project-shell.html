<!-- Shared Project Shell: AI 辅助论坛原型 -->
<!-- SLOTS: activeNavItem, pageTitle, pageMainContent -->

<!-- Global top navigation -->
<header class="sticky top-0 z-50 w-full border-b border-[var(--aif-border)] bg-[var(--aif-card)]/80 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <a href="index.html" class="flex items-center gap-2 text-xl font-bold text-[var(--aif-foreground)]" data-dom-id="nav-home">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-[var(--aif-primary)] text-[var(--aif-primary-foreground)]">
        <i data-lucide="messages-square" class="h-5 w-5"></i>
      </span>
      <span>AI 论坛</span>
    </a>

    <nav class="hidden items-center gap-1 md:flex">
      <a href="index.html" data-nav-key="home" data-dom-id="nav-home" class="nav-item rounded-md px-3 py-2 text-sm font-medium text-[var(--aif-muted-foreground)] hover:bg-[var(--aif-muted)] hover:text-[var(--aif-foreground)]">首页</a>
      <a href="explore.html" data-nav-key="explore" data-dom-id="nav-explore" class="nav-item rounded-md px-3 py-2 text-sm font-medium text-[var(--aif-muted-foreground)] hover:bg-[var(--aif-muted)] hover:text-[var(--aif-foreground)]">问题广场</a>
      <a href="dashboard.html" data-nav-key="dashboard" data-dom-id="nav-dashboard" class="nav-item rounded-md px-3 py-2 text-sm font-medium text-[var(--aif-muted-foreground)] hover:bg-[var(--aif-muted)] hover:text-[var(--aif-foreground)]">数据看板</a>
    </nav>

    <div class="flex items-center gap-3">
      <form class="relative hidden sm:block" onsubmit="return false;">
        <input type="text" placeholder="搜索问题…" class="h-9 w-64 rounded-md border border-[var(--aif-input)] bg-[var(--aif-muted)] px-3 pr-9 text-sm text-[var(--aif-foreground)] placeholder:text-[var(--aif-muted-foreground)] focus:border-[var(--aif-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--aif-ring)]/20" />
        <button type="submit" data-dom-id="search-submit" class="absolute right-1 top-1/2 -translate-y-1/2 rounded p-1 text-[var(--aif-muted-foreground)] hover:text-[var(--aif-foreground)]">
          <i data-lucide="search" class="h-4 w-4"></i>
        </button>
      </form>
      <a href="ask.html" data-dom-id="btn-ask" class="inline-flex items-center gap-1.5 rounded-md bg-[var(--aif-primary)] px-3 py-2 text-sm font-semibold text-[var(--aif-primary-foreground)] hover:bg-[var(--aif-primary-600)]">
        <i data-lucide="plus" class="h-4 w-4"></i>
        <span class="hidden sm:inline">提问</span>
      </a>
      <button class="relative flex h-9 w-9 items-center justify-center rounded-full bg-gradient-to-br from-[var(--aif-primary-300)] to-[var(--state-success)] text-xs font-bold text-white" data-dom-id="identity-chip" title="匿名身份">
        匿
      </button>
    </div>
  </div>
</header>

<!-- Page title region (optional, filled by leaf) -->
<!-- SLOT: pageTitle -->

<!-- Main content region -->
<main class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
  <!-- SLOT: pageMainContent -->
</main>

<!-- Footer -->
<footer class="mt-auto w-full border-t border-[var(--aif-border)] bg-[var(--aif-card)] py-8">
  <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-4 px-4 text-sm text-[var(--aif-muted-foreground)] sm:flex-row sm:px-6 lg:px-8">
    <p>AI 辅助论坛 · 匿名问答社区</p>
    <p>数据仅存储于本地，无后端 · 无账号</p>
  </div>
</footer>
